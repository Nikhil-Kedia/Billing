<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vikray — Billing &amp; Inventory</title>
<script>
/* Theme is applied before the first stylesheet paints, so a dark-mode user
   never sees a white flash on launch. Kept deliberately tiny and inline —
   a deferred module would be too late to matter. */
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('nova.theme') || '"system"');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<style>
  /* Boot cover — the window is never seen half-built. */
  #splash{position:fixed;inset:0;z-index:2000;background:var(--canvas);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .38s var(--ease),visibility .38s}
  #splash.gone{opacity:0;visibility:hidden}
  #splash .mark{width:52px;height:52px;border-radius:15px;background:var(--accent-grad);
    color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(91,75,232,.32);animation:pop .5s var(--ease-spring) both}
  #splash .nm{font-size:15px;font-weight:640;letter-spacing:-.01em;animation:rise .5s .08s var(--ease-out) both}
  #splash .tag{font-size:11.5px;color:var(--ink-3);margin-top:-12px;animation:rise .5s .14s var(--ease-out) both}
  #splash .track{width:132px;height:3px;border-radius:99px;background:var(--surface-3);overflow:hidden}
  #splash .track i{display:block;height:100%;width:40%;border-radius:99px;background:var(--accent);
    animation:sweep 1.15s var(--ease) infinite}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
</style>
</head>
<body>

<div id="splash">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>
    </svg>
  </div>
  <div class="nm">Vikray</div>
  <div class="tag">Billing &amp; Inventory</div>
  <div class="track"><i></i></div>
</div>

<div id="app"></div>

<script>
/* A blank window is the worst failure a desktop app can have: nothing to
   read, nothing to act on. If the interface hasn't booted within a few
   seconds, say so plainly and show what actually went wrong. */
(function () {
  var firstError = null;
  window.addEventListener('error', function (e) {
    if (!firstError) firstError = (e && (e.message || e.error)) || 'Unknown error';
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    if (!firstError) firstError = (e && e.reason && (e.reason.message || e.reason)) || 'Unknown error';
  });
  setTimeout(function () {
    if (window.__novaBooted) return;
    var s = document.getElementById('splash');
    if (!s) return;
    s.innerHTML =
      '<div style="max-width:440px;text-align:center;padding:24px">' +
        '<div style="font-size:15px;font-weight:640;margin-bottom:8px">Vikray could not start</div>' +
        '<div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">' +
          'The interface did not load. Closing and reopening the app usually clears this. ' +
          'If it keeps happening, the log in your data folder has the detail.' +
        '</div>' +
        (firstError ? '<div style="font-family:Consolas,monospace;font-size:11px;color:var(--ink-3);' +
          'margin-top:14px;padding:10px;background:var(--surface-2);border-radius:8px;text-align:left;' +
          'white-space:pre-wrap;word-break:break-word">' + String(firstError).slice(0, 400) + '</div>' : '') +
      '</div>';
  }, 9000);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
